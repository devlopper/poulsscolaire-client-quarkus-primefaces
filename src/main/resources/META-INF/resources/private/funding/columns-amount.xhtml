<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
  xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <ui:decorate template="/extension/component/column/default.xhtml">
    <ui:param name="column" value="#{container.amountColumn}" />
    <ui:define name="column-body">
      <p:inputNumber value="#{record.amount}" maxValue="99999999999999"
        inputStyleClass="colonne-montant" rendered="#{record.amountInputable}">
        <p:ajax event="valueChange" listener="#{container.listenAmountChange(record)}"
          update="#{container.listController.dataTable.identifier}" />
      </p:inputNumber>

      <p:outputPanel styleClass="colonne-montant" rendered="#{not record.amountInputable}">
        <h:outputText value="#{record.amountAsString}" />
      </p:outputPanel>
    </ui:define>
  </ui:decorate>

</ui:composition>
