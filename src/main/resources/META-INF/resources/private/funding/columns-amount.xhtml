<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
  xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <p:column>
    <f:facet name="header">
      <div class="pull-right">
        <h:outputText value="#{container.amountColumn.headerText}" />
      </div>
    </f:facet>

    <p:inputNumber value="#{record.amount}" maxValue="99999999999999" inputStyleClass="input-amount"
      rendered="#{record.amountInputable}">
      <p:ajax event="valueChange" listener="#{container.listenAmountChange(record)}"
        update="#{container.listController.dataTable.identifier}" />
    </p:inputNumber>

    <p:outputPanel styleClass="pull-right" rendered="#{not record.amountInputable}">
      <h:outputText value="#{record.amountAsString}" />
    </p:outputPanel>

    <f:facet name="footer">
      <div class="pull-right">
        <h:outputText value="#{container.amountColumn.footerText}" />
      </div>
    </f:facet>
  </p:column>

</ui:composition>
