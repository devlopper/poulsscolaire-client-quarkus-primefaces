<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
  xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <p:importConstants type="org.cyk.system.poulsscolaire.server.api.accounting.FundingDto"
    var="FundingDto" />

  <p:column headerText="Budget"
    rendered="#{listController.isReadControllerHasProjectionName(FundingDto.JSON_BUDGET_AS_STRING)}">
    <h:outputText value="#{record.budgetAsString}" />
  </p:column>
  
  <p:column headerText="Mois" width="150"
    rendered="#{listController.isReadControllerHasProjectionName(FundingDto.JSON_MONTH_AS_STRING)}">
    <h:outputText value="#{record.monthAsString}" />
  </p:column>

  <p:column headerText="Département"
    rendered="#{listController.isReadControllerHasProjectionName(FundingDto.JSON_DEPARTMENT_AS_STRING)}">
    <h:outputText value="#{record.departmentAsString}" />
  </p:column>

  <p:column headerText="Compte comptable"
    rendered="#{listController.isReadControllerHasProjectionName(FundingDto.JSON_ACCOUNTING_ACCOUNT_AS_STRING)}">
    <h:outputText value="#{record.accountingAccountAsString}" />
  </p:column>
  
  <p:column headerText="Source de financement"
    rendered="#{listController.isReadControllerHasProjectionName(FundingDto.JSON_SOURCE_AS_STRING)}">
    <h:outputText value="#{record.sourceAsString}" />
  </p:column>
  
  <ui:include src="columns-amount.xhtml">
    <ui:param name="container" value="#{container}" />
    <ui:param name="record" value="#{record}" />
  </ui:include>

  <p:column headerText="Justification"
    rendered="#{listController.isReadControllerHasProjectionName(FundingDto.JSON_JUSTIFICATION)}">
    <h:outputText value="#{record.justification}" />
  </p:column>
  
  <p:column headerText="Engagé" width="100"
    rendered="#{listController.isReadControllerHasProjectionName(FundingDto.JSON_COMMITMENT_AMOUNT_AS_STRING)}">
    <h:outputText value="#{record.commitmentAmountAsString}" />
  </p:column>
</ui:composition>
