<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
  xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <p:importConstants type="org.cyk.system.poulsscolaire.server.api.accounting.FundingExecutionDto"
    var="FundingExecutionDto" />

  <p:column headerText="Financement"
    rendered="#{listController.isReadControllerHasProjectionName(FundingExecutionDto.JSON_FUNDING_AS_STRING)}">
    <h:outputText value="#{record.fundingAsString}" />
  </p:column>

  <p:column headerText="Montant" width="100"
    rendered="#{listController.isReadControllerHasProjectionName(FundingExecutionDto.JSON_AMOUNT_AS_STRING)}">
    <h:outputText value="#{record.amountAsString}" />
  </p:column>
</ui:composition>
