<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
  xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <p:importConstants type="org.cyk.system.poulsscolaire.server.api.accounting.BudgetDto"
    var="BudgetDto" />

  <p:column headerText="Code" width="100"
    rendered="#{listController.isReadControllerHasProjectionName(BudgetDto.JSON_CODE)}">
    <h:outputText value="#{record.code}" />
  </p:column>

  <p:column headerText="Libellé"
    rendered="#{listController.isReadControllerHasProjectionName(BudgetDto.JSON_NAME)}">
    <h:outputText value="#{record.name}" />
  </p:column>

  <p:column headerText="Ecole"
    rendered="#{listController.isReadControllerHasProjectionName(BudgetDto.JSON_SCHOOL_AS_STRING)}">
    <h:outputText value="#{record.schoolAsString}" />
  </p:column>

  <p:column headerText="Plan comptable"
    rendered="#{listController.isReadControllerHasProjectionName(BudgetDto.JSON_ACCOUNTING_PLAN_AS_STRING)}">
    <h:outputText value="#{record.accountingPlanAsString}" />
  </p:column>

  <p:column headerText="Année" width="150"
    rendered="#{listController.isReadControllerHasProjectionName(BudgetDto.JSON_YEAR)}">
    <h:outputText value="#{record.yearAsString}" />
  </p:column>

  <p:column headerText="Montant" width="150"
    rendered="#{listController.isReadControllerHasProjectionName(BudgetDto.JSON_AMOUNT_AS_STRING)}">
    <h:outputText value="#{record.amountAsString}" />
  </p:column>
</ui:composition>
