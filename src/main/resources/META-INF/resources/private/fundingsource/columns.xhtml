<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
  xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <p:importConstants type="org.cyk.system.poulsscolaire.server.api.accounting.FundingSourceDto"
    var="FundingSourceDto" />

  <p:column headerText="Code" width="100"
    rendered="#{listController.isReadControllerHasProjectionName(FundingSourceDto.JSON_CODE)}">
    <h:outputText value="#{record.code}" />
  </p:column>

  <p:column headerText="Libellé"
    rendered="#{listController.isReadControllerHasProjectionName(FundingSourceDto.JSON_NAME)}">
    <h:outputText value="#{record.name}" />
  </p:column>

  <p:column headerText="Ecole"
    rendered="#{listController.isReadControllerHasProjectionName(FundingSourceDto.JSON_SCHOOL_AS_STRING)}">
    <h:outputText value="#{record.schoolAsString}" />
  </p:column>
</ui:composition>
